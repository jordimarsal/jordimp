# Retrieval eval gate — the committed quality floor for ask-api.
# Every question must retrieve its expected source within top-k;
# off-corpus questions must stay below the configured threshold.
# Run: ASK_EMBED_BACKEND=hash uv run ask-api eval --golden evals/golden.yaml
floor: 0.70      # committed floor for the deterministic (hash) CI gate — regression detection;
                 # measured baseline 0.80 (lexical embedder + heading-embedded text)
floor_real: 0.90 # floor with real nomic embeddings + task prefixes + heading-embedded text;
                 # measured 1.000 (15/15) — one golden miss still passes
questions:
