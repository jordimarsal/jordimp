name: Quality audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p reports
      - run: npm run build
      - run: npx vitest run --reporter=json --outputFile=reports/vitest.json
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=json > reports/playwright.json
      - run: npm run qa:lighthouse
      - run: node scripts/collect-quality.mjs
      - run: |
          git config user.name "jordimp-quality-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/quality.json
          git commit -m "chore(quality): weekly inspection audit ($(date -I))"
          git push
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: quality-audit-artifacts
          path: |
            reports/
            .lighthouseci/
          retention-days: 7
