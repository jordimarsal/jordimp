name: ask-api quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - "ask-api/**"
      - ".github/workflows/ask-api.yml"
  push:
    branches: [main]
    paths:
      - "ask-api/**"
      - ".github/workflows/ask-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ask-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run black --check src tests
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Eval gate (deterministic, committed retrieval floor)
        run: ASK_EMBED_BACKEND=hash ASK_GEN_BACKEND=echo uv run ask-api eval
