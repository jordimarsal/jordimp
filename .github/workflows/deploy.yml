name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qa:
    permissions:
      contents: read
    uses: ./.github/workflows/qa.yml
  deploy:
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Build site (redesign at root)
        run: |
          npm ci
          npm run build
      - name: Build demo (redesign, noindex, base /demo; retirement decided at T20)
        run: npm run build:demo
      - name: Keep the demo live under /demo/ (removal decided at T20)
        run: cp -r dist-demo dist/demo
      - name: Verify CNAME in build output
        run: test -f dist/CNAME && grep -qx 'jordimp.net' dist/CNAME
      - name: Verify production artifact before upload
        run: |
          test -f dist/en/index.html
          grep -q 'JORDIMP' dist/index.html
          if grep -q 'Disallow: /demo/' dist/robots.txt; then
            echo '::error::robots.txt still contains the transition Disallow: /demo/ line'
            exit 1
          fi
          if grep -q '/en/experience/' dist/en/index.html; then
            echo '::error::old-site marker /en/experience/ found in the new root build'
            exit 1
          fi
      - name: Verify demo subpath before upload
        run: |
          test -f dist/demo/en/index.html
          grep -q 'noindex' dist/demo/en/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
