services:
  status-api:
    build: .
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      # the container reads the pool through the read-only volume mount below
      APP_POOL_PATH: /data/pool/pool.jsonl
    volumes:
      - ~/ia/llama/ggufbench/results/models:/data/pool:ro
    restart: unless-stopped
    # NOTE: The public route is configured in the Cloudflare dashboard (token-managed tunnel),
    # routing api.jordimp.net/status* -> localhost:8081. This is NOT managed here.
