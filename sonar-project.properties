# SonarQube scanner defaults — picked up automatically when sonar-scanner runs
# from the repo root (CLI -D flags override these).
#
# Lock files are machine-generated: every dependency entry repeats the same JSON
# shape, so the copy-paste detector fills the new-code duplication gate with
# noise. Audit the manifest (package.json), not the lock.
sonar.exclusions=**/package-lock.json
sonar.cpd.exclusions=**/package-lock.json
