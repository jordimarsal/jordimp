# SonarQube scanner config (flota — plenat pel sonar-scan-fleet d'estol).
sonar.projectKey=jordimarsal:jordimp
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Codi de producte: backend ask-api (python) + arrel (ts/astro) + scripts.
sonar.sources=ask-api/src,src,scripts
sonar.tests=ask-api/tests,tests

sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/.scannerwork/**

# Cobertura: sense informe de cobertura per ara — fora del calcul del gate
# (el tracker/cv-bin el cablejarem quan hi haja mesura de cobertura).
sonar.coverage.exclusions=**/*
