# SonarQube scanner defaults — picked up automatically when sonar-scanner runs
# from the repo root (CLI -D flags override these).
#
# CPD exclusions: machine-generated or schema-shaped data files. Their
# repetition is the data schema, not copy-paste:
#   - package-lock.json: machine-generated dependency blocks.
#   - src/data/content.ts: trilingual content module; every project repeats
#     the same {blurb, summary, problem, highlights, metrics} structure with
#     different copy (the l10n schema), which CPD counts as duplication.
#   - src/data/quality.json: audit fixture regenerated by scripts/collect-quality.mjs.
sonar.cpd.exclusions=**/package-lock.json,src/data/content.ts,src/data/quality.json
sonar.exclusions=**/package-lock.json
